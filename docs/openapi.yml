  /api/summaries/:
    get:
      operationId: summaries_list
      summary: Сводки от ML (сколько людей проверено / нарушителей)
      parameters:
      - in: query
        name: camera
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
        description: ISO datetime
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - summaries
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCameraSummaryList'
          description: ''
    post:
      operationId: summaries_create
      summary: Сводка от ML раз в минуту (также признак «ML работает»)
      parameters:
      - in: header
        name: X-API-Key
        schema:
          type: string
        description: Ключ ML-модуля (обязателен, если на сервере задан ML_API_KEY)
      tags:
      - summaries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraSummary'
            examples:
              Пример:
                value:
                  camera_id: 1
                  timestamp: '2026-11-20T12:01:00+03:00'
                  people_checked: 12
                  violators: 2
                  model_version: yolov8n-ppe-0.3
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CameraSummary'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CameraSummary'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
