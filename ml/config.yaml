 #Общие настройки для обоих разработчиков.
# Меняйте значения здесь, а не в коде, чтобы у вас двоих они совпадали.

model: ppe_v2.pt                  # обученная модель СИЗ (лежит в папке ml)
model_version: yolov8n-ppe-0.1  # название версии, уходит в результаты и потом в бэкенд
conf: 0.25                      # общий порог уверенности (для классов без своего порога)
iou: 0.5                        # порог для склейки пересекающихся рамок
imgsz: 640                      # размер картинки для нейросети
stride: 2

# Какие классы показывать и сохранять. Названия должны совпадать с названиями в модели.
# Лишние классы (маски, очки) не включаем: они не входят в нашу задачу.
show_classes:
  - Person
  - Hardhat
  - NO-Hardhat
  - Safety Vest
  - NO-Safety Vest
  - Glove
  - NO-Glove

# Свой порог для классов-нарушений. Значения стартовые, их нужно подбирать по проверке:
# выше порог = меньше ложных нарушений, но больше пропусков.
class_conf:
  NO-Hardhat: 0.3
  NO-Safety Vest: 0.3
  NO-Glove: 0.3

# Какой класс модели какому коду нарушения в базе соответствует.
violation_codes:
  NO-Hardhat: NO_HELMET
  NO-Safety Vest: NO_VEST
  NO-Glove: NO_GLOVES

output_dir: outputs             # сюда сохраняются видео с рамками и .jsonl
log_file: logs/run.log          # журнал работы
