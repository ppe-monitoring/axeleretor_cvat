openapi: 3.0.3
info:
  title: PPE Monitor API
  version: 0.1.0
paths:
  /api/cameras/:
    get:
      operationId: cameras_list
      summary: Камеры (ml_online = ML присылал сводку за последние 3 минуты)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - cameras
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
