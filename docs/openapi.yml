          application/json:
            schema:
              $ref: '#/components/schemas/Camera'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Camera'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Camera'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
          description: ''
