components:
  schemas:
    Camera:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ml_last_seen:
          type: string
          format: date-time
          readOnly: true
        ml_online:
          type: boolean
          readOnly: true
        name:
          type: string
          maxLength: 100
        source_type:
          $ref: '#/components/schemas/SourceTypeEnum'
        source_uri:
          type: string
          maxLength: 500
        location:
          type: string
          maxLength: 200
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - ml_last_seen
      - ml_online
      - name
    CameraSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
        people_checked:
          type: integer
          maximum: 2147483647
          minimum: 0
        violators:
          type: integer
          maximum: 2147483647
          minimum: 0
        model_version:
          type: string
          maxLength: 50
        camera:
          type: integer
        zone:
          type: integer
          nullable: true
      required:
      - camera
      - id
      - people_checked
      - violators
    CodeEnum:
      enum:
      - NO_HELMET
      - NO_VEST
      - NO_GLOVES
      type: string
      description: |-
        * `NO_HELMET` - Нет каски
        * `NO_VEST` - Нет жилета
        * `NO_GLOVES` - Нет перчаток
    PPERule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          $ref: '#/components/schemas/CodeEnum'
        is_active:
          type: boolean
        zone:
          type: integer
      required:
      - code
      - id
      - zone
    PaginatedCameraList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Camera'
    PaginatedCameraSummaryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
