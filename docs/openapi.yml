  /api/violations/:
    get:
      operationId: violations_list
      summary: Лента нарушений
      parameters:
      - in: query
        name: camera
        schema:
          type: integer
      - in: query
        name: code
        schema:
          type: string
        description: Например NO_HELMET
      - in: query
        name: date_from
        schema:
          type: string
        description: ISO datetime
      - in: query
        name: date_to
        schema:
          type: string
        description: ISO datetime
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: new / confirmed / false_positive
      - in: query
        name: video
        schema:
          type: integer
      - in: query
        name: zone
        schema:
          type: integer
      tags:
      - violations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedViolationList'
          description: ''
    post:
      operationId: violations_create
      description: 'Одно событие = один человек на кадре, можно прислать список событий.
        bbox это рамка человека. Склейка: камера + зона + track_id + код, пауза больше
        5 секунд начинает новый инцидент. Повтор с тем же event_id не создаёт дублей.
        Список: 201 всё принято, 207 часть отклонена, 400 всё отклонено.'
      summary: Приём нарушений от ML
      parameters:
      - in: header
        name: X-API-Key
        schema:
          type: string
        description: Ключ ML-модуля (обязателен, если на сервере задан ML_API_KEY)
      tags:
      - violations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViolationEvent'
            examples:
              ПримерОтML:
                value:
                  event_id: run42-t7-f120
                  camera_id: 1
                  zone_id: 1
                  video_id: 5
                  track_id: 7
                  frame_number: 120
                  timestamp: '2026-11-20T12:00:03+03:00'
                  frame_width: 1280
                  frame_height: 720
                  model_version: yolov8n-ppe-0.3
                  bbox:
                  - 185.2
                  - 40.1
                  - 410.7
                  - 520.3
                  violations:
                  - code: NO_HELMET
                    confidence: 0.91
                  - code: NO_VEST
                    confidence: 0.84
                summary: Пример от ML
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ViolationEvent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ViolationEvent'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Violation'
          description: ''
