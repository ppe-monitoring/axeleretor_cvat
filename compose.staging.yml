services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ppe
      POSTGRES_USER: ppe
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppe -d ppe"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ppe
      DB_USER: ppe
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
      ML_API_KEY: ${ML_API_KEY:?Set ML_API_KEY}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/cameras/', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-8080}:80"
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/cameras/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  media:
  static:
